[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mapped-sphere-pinn"
version = "1.0.0"
description = "Meshfree atlas-based PINN/FEM framework for forward and inverse PDEs on complex 3D geometry (paper examples)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Example 2 (Stanford Bunny): exact mesh geometry and sparse direct solves.
bunny = ["scipy>=1.9", "pyvista>=0.40"]

[tool.setuptools]
packages = ["mapped_sphere", "mapped_sphere.elastoplastic"]
